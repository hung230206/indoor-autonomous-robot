[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indoor-robot-nav"
version = "0.1.0"
description = "Stage 1 indoor differential-drive robot navigation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
visual = ["matplotlib>=3.8", "Pillow>=10"]
video = ["imageio-ffmpeg>=0.6"]
yolo = ["ultralytics>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]
