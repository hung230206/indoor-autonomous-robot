<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1170" viewBox="0 0 1560 1170">
<title>Tín hiệu ESP32 — motor và phần dành cho cảm biến</title><desc>Mọi GND dùng chung phía P-. Chân GPIO là số IO, không phải số thứ tự header.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#3466ad"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#203047}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#54667b}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px}</style>
<rect width="1560" height="1170" fill="#f8fafc"/>
<text x="40" y="55" class="title" text-anchor="start">Tín hiệu ESP32 — motor và phần dành cho cảm biến</text>
<text x="40" y="88" class="sub" text-anchor="start">Mọi GND dùng chung phía P-. Chân GPIO là số IO, không phải số thứ tự header.</text>
<rect x="40" y="150" width="310" height="540" rx="12" fill="#edf8f3" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="58" y="182" class="head" text-anchor="start">TB6612FNG</text>
<text x="58" y="213" class="body" text-anchor="start">VCC = 3V3 ESP32</text>
<text x="58" y="240" class="body" text-anchor="start">VM = 5V_MOTOR</text>
<text x="58" y="267" class="body" text-anchor="start">AO → motor trái; BO → phải</text>
<rect x="520" y="150" width="390" height="660" rx="12" fill="#edf3ff" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="538" y="182" class="head" text-anchor="start">NodeMCU-32S</text>
<text x="310" y="290" class="body" text-anchor="end">PWMA</text>
<polyline points="520,300 350,300" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="540" y="306" class="body" text-anchor="start">GPIO25 → PWMA</text>
<text x="310" y="340" class="body" text-anchor="end">AIN1</text>
<polyline points="520,350 350,350" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="540" y="356" class="body" text-anchor="start">GPIO26 → AIN1</text>
<text x="310" y="390" class="body" text-anchor="end">AIN2</text>
<polyline points="520,400 350,400" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="540" y="406" class="body" text-anchor="start">GPIO27 → AIN2</text>
<text x="310" y="440" class="body" text-anchor="end">PWMB</text>
<polyline points="520,450 350,450" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="540" y="456" class="body" text-anchor="start">GPIO14 → PWMB</text>
<text x="310" y="490" class="body" text-anchor="end">BIN1</text>
<polyline points="520,500 350,500" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="540" y="506" class="body" text-anchor="start">GPIO16 → BIN1</text>
<text x="310" y="540" class="body" text-anchor="end">BIN2</text>
<polyline points="520,550 350,550" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="540" y="556" class="body" text-anchor="start">GPIO17 → BIN2</text>
<text x="310" y="590" class="body" text-anchor="end">STBY</text>
<polyline points="520,600 350,600" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="540" y="606" class="body" text-anchor="start">GPIO23 → STBY</text>
<text x="58" y="650" class="body" text-anchor="start">7 × 10 kΩ xuống GND</text>
<text x="540" y="740" class="body" text-anchor="start">GPIO33/36/22: dự phòng</text>
<text x="540" y="775" class="small" text-anchor="start">STBY luôn LOW trước khi RUN</text>
<rect x="1120" y="150" width="400" height="260" rx="12" fill="#fff5e8" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="1138" y="182" class="head" text-anchor="start">AHCT125, chỉ GĐ3</text>
<text x="1138" y="213" class="body" text-anchor="start">VCC14 = 5V_LOGIC, GND7</text>
<text x="1138" y="240" class="body" text-anchor="start">GPIO18 → 2(A) / 3(Y) → TRIG trước</text>
<text x="1138" y="267" class="body" text-anchor="start">GPIO19 → 5(A) / 6(Y) → TRIG trái</text>
<text x="1138" y="294" class="body" text-anchor="start">GPIO21 → 9(A) / 8(Y) → TRIG phải</text>
<text x="1138" y="321" class="body" text-anchor="start">/OE 1,4,10 → GND; 10k ở mỗi A</text>
<text x="1138" y="348" class="body" text-anchor="start">Kênh 4: /OE13 → 5V; A12 → GND</text>
<text x="925" y="220" class="small" text-anchor="start">GPIO18</text>
<polyline points="910,230 1120,230" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="925" y="285" class="small" text-anchor="start">GPIO19</text>
<polyline points="910,295 1120,295" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="925" y="350" class="small" text-anchor="start">GPIO21</text>
<polyline points="910,360 1120,360" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1120" y="475" width="400" height="285" rx="12" fill="#edf8f3" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="1138" y="507" class="head" text-anchor="start">HC-SR04 × 3, chỉ GĐ3</text>
<text x="1138" y="538" class="body" text-anchor="start">VCC = 5V_LOGIC; GND chung</text>
<text x="1138" y="565" class="body" text-anchor="start">Mỗi Echo qua một bộ chia riêng</text>
<text x="1138" y="592" class="body" text-anchor="start">TRIG nhận từ buffer phía trên</text>
<text x="1138" y="619" class="body" text-anchor="start">Trước: Echo → GPIO34</text>
<text x="1138" y="646" class="body" text-anchor="start">Trái: Echo → GPIO35</text>
<text x="1138" y="673" class="body" text-anchor="start">Phải: Echo → GPIO32</text>
<text x="925" y="558" class="small" text-anchor="start">GPIO34</text>
<polyline points="1120,570 910,570" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1000" y="593" class="small" text-anchor="middle">10k / 15k</text>
<text x="925" y="628" class="small" text-anchor="start">GPIO35</text>
<polyline points="1120,640 910,640" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1000" y="663" class="small" text-anchor="middle">10k / 15k</text>
<text x="925" y="698" class="small" text-anchor="start">GPIO32</text>
<polyline points="1120,710 910,710" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1000" y="733" class="small" text-anchor="middle">10k / 15k</text>
<rect x="40" y="855" width="1480" height="250" rx="12" fill="#ffffff" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="58" y="887" class="head" text-anchor="start">Mỗi đường Echo: bộ chia 10 kΩ / 15 kΩ, dung sai 1%</text>
<text x="90" y="957" class="body" text-anchor="start">Echo 5 V</text>
<polyline points="205,950 330,950" fill="none" stroke="#b07925" stroke-width="3" stroke-linejoin="round"/>
<rect x="330" y="925" width="170" height="60" rx="12" fill="#ffffff" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="348" y="957" class="head" text-anchor="start">Rtop 10k</text>
<polyline points="500,950 690,950 870,950" fill="none" stroke="#b07925" stroke-width="3" stroke-linejoin="round"/>
<circle cx="690" cy="950" r="5" fill="#b07925"/>
<text x="900" y="957" class="body" text-anchor="start">→ GPIO Echo: 3,00 V danh định</text>
<polyline points="690,950 690,975" fill="none" stroke="#34465a" stroke-width="3" stroke-linejoin="round"/>
<rect x="675" y="975" width="30" height="55" fill="#fff" stroke="#34465a" stroke-width="2"/>
<polyline points="690,1030 690,1045" fill="none" stroke="#34465a" stroke-width="3" stroke-linejoin="round"/>
<polyline points="670,1045 710,1045" fill="none" stroke="#34465a" stroke-width="2" stroke-linejoin="round"/>
<polyline points="677,1052 703,1052" fill="none" stroke="#34465a" stroke-width="2" stroke-linejoin="round"/>
<polyline points="684,1059 696,1059" fill="none" stroke="#34465a" stroke-width="2" stroke-linejoin="round"/>
<text x="720" y="1014" class="body" text-anchor="start">Rbottom 15k → GND_LOAD</text>
<text x="90" y="1070" class="small" text-anchor="start">Tối đa tính toán ≈3,18 V khi Echo 5,25 V và điện trở 1%. Cần kiểm chứng mức/xung thực tế.</text>
<text x="40" y="1140" class="small" text-anchor="start">Không nối Echo thẳng ESP32. Phần sensor/buffer chưa cần lắp ở GĐ2. Hướng dẫn đủ chân DIP và tụ nằm trong wiring.md.</text>
</svg>
