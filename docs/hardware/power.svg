<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1040" viewBox="0 0 1520 1040">
<title>Nguồn xe 2WD — bản thiết kế v1</title><desc>Hai LM2596 cùng đầu vào, tách đầu ra 5 V. Đối chiếu model BMS trước khi đấu điện.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#3466ad"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#203047}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#54667b}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px}</style>
<rect width="1520" height="1040" fill="#f8fafc"/>
<text x="40" y="55" class="title" text-anchor="start">Nguồn xe 2WD — bản thiết kế v1</text>
<text x="40" y="88" class="sub" text-anchor="start">Hai LM2596 cùng đầu vào, tách đầu ra 5 V. Đối chiếu model BMS trước khi đấu điện.</text>
<rect x="40" y="140" width="250" height="250" rx="12" fill="#fff5e8" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="58" y="172" class="head" text-anchor="start">Hộp pin 2S</text>
<text x="58" y="211" class="body" text-anchor="start">C2 (+) → B+</text>
<text x="58" y="256" class="body" text-anchor="start">BM: C1 (+) / C2 (-)</text>
<text x="58" y="301" class="body" text-anchor="start">C1 (-) → B-</text>
<text x="58" y="358" class="body" text-anchor="start">Cần dây điểm giữa</text>
<rect x="360" y="140" width="240" height="250" rx="12" fill="#edf8f3" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="378" y="172" class="head" text-anchor="start">BMS 2S</text>
<text x="378" y="211" class="body" text-anchor="start">B+</text>
<text x="378" y="256" class="body" text-anchor="start">BM</text>
<text x="378" y="301" class="body" text-anchor="start">B-</text>
<text x="558" y="211" class="body" text-anchor="start">P+</text>
<text x="558" y="341" class="body" text-anchor="start">P-</text>
<text x="378" y="372" class="small" text-anchor="start">Theo đúng module</text>
<polyline points="290,205 360,205" fill="none" stroke="#b07925" stroke-width="2" stroke-linejoin="round"/>
<polyline points="290,250 360,250" fill="none" stroke="#b07925" stroke-width="2" stroke-linejoin="round"/>
<polyline points="290,295 360,295" fill="none" stroke="#b07925" stroke-width="2" stroke-linejoin="round"/>
<polyline points="600,205 640,205" fill="none" stroke="#c43f48" stroke-width="3" stroke-linejoin="round"/>
<rect x="640" y="180" width="80" height="55" rx="12" fill="#ffffff" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="658" y="212" class="head" text-anchor="start">F1</text>
<polyline points="720,205 760,205" fill="none" stroke="#c43f48" stroke-width="3" stroke-linejoin="round"/>
<rect x="760" y="180" width="80" height="55" rx="12" fill="#ffffff" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="778" y="212" class="head" text-anchor="start">S1</text>
<polyline points="840,205 980,205" fill="none" stroke="#c43f48" stroke-width="3" stroke-linejoin="round"/>
<circle cx="900" cy="205" r="5" fill="#c43f48"/>
<rect x="980" y="150" width="180" height="130" rx="12" fill="#fff1f2" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="998" y="182" class="head" text-anchor="start">LM2596 #1</text>
<text x="998" y="213" class="body" text-anchor="start">OUT+ = 5,00 V</text>
<text x="998" y="240" class="body" text-anchor="start">5V_LOGIC</text>
<text x="998" y="267" class="body" text-anchor="start">IN-/OUT-: GND</text>
<polyline points="1160,205 1230,205" fill="none" stroke="#c43f48" stroke-width="3" stroke-linejoin="round"/>
<text x="1180" y="185" class="small" text-anchor="start">5 V</text>
<rect x="1230" y="150" width="250" height="205" rx="12" fill="#edf3ff" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="1248" y="182" class="head" text-anchor="start">ESP32</text>
<text x="1248" y="213" class="body" text-anchor="start">Micro-USB: VBUS/GND</text>
<text x="1248" y="240" class="body" text-anchor="start">Cáp nguồn 2 dây</text>
<text x="1248" y="267" class="body" text-anchor="start">Ngắt trước khi cắm PC</text>
<text x="1248" y="294" class="body" text-anchor="start">3V3 → VCC driver</text>
<polyline points="900,205 900,485 980,485" fill="none" stroke="#c43f48" stroke-width="3" stroke-linejoin="round"/>
<rect x="980" y="430" width="180" height="130" rx="12" fill="#fff1f2" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="998" y="462" class="head" text-anchor="start">LM2596 #2</text>
<text x="998" y="493" class="body" text-anchor="start">OUT+ = 5,00 V</text>
<text x="998" y="520" class="body" text-anchor="start">5V_MOTOR</text>
<text x="998" y="547" class="body" text-anchor="start">IN-/OUT-: GND</text>
<polyline points="1160,485 1205,485" fill="none" stroke="#c43f48" stroke-width="3" stroke-linejoin="round"/>
<rect x="1205" y="460" width="75" height="55" rx="12" fill="#ffffff" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="1223" y="492" class="head" text-anchor="start">S2</text>
<polyline points="1280,485 1320,485" fill="none" stroke="#c43f48" stroke-width="3" stroke-linejoin="round"/>
<rect x="1320" y="430" width="160" height="225" rx="12" fill="#edf8f3" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="1338" y="462" class="head" text-anchor="start">TB6612FNG</text>
<text x="1338" y="491" class="body" text-anchor="start">VM: 5 V</text>
<text x="1338" y="530" class="body" text-anchor="start">GND: P- tải</text>
<text x="1338" y="576" class="body" text-anchor="start">AO1/AO2</text>
<text x="1338" y="616" class="body" text-anchor="start">BO1/BO2</text>
<polyline points="1440,355 1440,405 1400,405 1400,430" fill="none" stroke="#8154b6" stroke-width="3" stroke-linejoin="round"/>
<text x="1260" y="395" class="small" text-anchor="start">3V3 từ ESP32</text>
<text x="1412" y="423" class="small" text-anchor="start">VCC</text>
<polyline points="600,335 640,335 640,740 1480,740" fill="none" stroke="#34465a" stroke-width="4" stroke-linejoin="round"/>
<text x="660" y="720" class="head" text-anchor="start">GND_LOAD = P- bảo vệ; không nối thêm B- vào tải</text>
<circle cx="760" cy="740" r="5" fill="#34465a"/>
<polyline points="760,740 760,762" fill="none" stroke="#34465a" stroke-width="2" stroke-linejoin="round"/>
<text x="760" y="788" class="small" text-anchor="middle">Buck #1</text>
<circle cx="1010" cy="740" r="5" fill="#34465a"/>
<polyline points="1010,740 1010,762" fill="none" stroke="#34465a" stroke-width="2" stroke-linejoin="round"/>
<text x="1010" y="788" class="small" text-anchor="middle">Buck #2</text>
<circle cx="1230" cy="740" r="5" fill="#34465a"/>
<polyline points="1230,740 1230,762" fill="none" stroke="#34465a" stroke-width="2" stroke-linejoin="round"/>
<text x="1230" y="788" class="small" text-anchor="middle">ESP / driver</text>
<circle cx="1430" cy="740" r="5" fill="#34465a"/>
<polyline points="1430,740 1430,762" fill="none" stroke="#34465a" stroke-width="2" stroke-linejoin="round"/>
<text x="1430" y="788" class="small" text-anchor="middle">HC / buffer</text>
<rect x="980" y="820" width="500" height="125" rx="12" fill="#edf3ff" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="998" y="852" class="head" text-anchor="start">Hai motor TT</text>
<text x="998" y="883" class="body" text-anchor="start">AO1/AO2 → motor trái; BO1/BO2 → motor phải</text>
<text x="998" y="910" class="body" text-anchor="start">Hai đầu mỗi motor chỉ nối vào cặp ngõ ra driver</text>
<polyline points="1480,570 1500,570 1500,855 1480,855" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round"/>
<polyline points="1480,610 1510,610 1510,890 1480,890" fill="none" stroke="#3466ad" stroke-width="2" stroke-linejoin="round"/>
<rect x="40" y="820" width="880" height="160" rx="12" fill="#fff5e8" stroke="#9fb2c9" stroke-width="1.5"/>
<text x="58" y="852" class="head" text-anchor="start">Ghi chú đấu nguồn</text>
<text x="58" y="883" class="body" text-anchor="start">F1: chọn sau khi biết dòng; S1: ngắt cả xe; S2: cắt nhánh VM.</text>
<text x="58" y="910" class="body" text-anchor="start">5V_LOGIC còn cấp HC-SR04 và buffer ở GĐ3, không lấy từ VM.</text>
<text x="58" y="937" class="body" text-anchor="start">Tụ gần driver: VCC 10 µF + 100 nF; VM 470 µF + 100 nF.</text>
<text x="58" y="964" class="body" text-anchor="start">Chỉnh buck khi chưa nối tải; không nối hai OUT+ với nhau.</text>
<text x="40" y="1012" class="small" text-anchor="start">Sơ đồ chức năng theo tên chân, không phải PCB/pad map. Chưa mua, chưa lắp, chưa đo tải. Chi tiết: wiring.md.</text>
</svg>
